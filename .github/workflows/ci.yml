name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore TaskManager.slnx
      - run: dotnet build TaskManager.slnx --no-restore -c Release
      - run: dotnet test TaskManager.slnx --no-build -c Release
